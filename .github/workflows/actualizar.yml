name: Actualizar noticias

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

# Permisos mínimos por defecto; solo el job que publica puede escribir.
permissions:
  contents: read

concurrency:
  group: actualizar-noticias
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      # Actions fijadas a SHA de commit (la etiqueta va en el comentario).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Pruebas (antes de generar y publicar)
        run: |
          python -m pip install --disable-pip-version-check -q "pytest==8.3.4"
          ./run_tests.sh

      - name: Descargar feeds y armar consenso
        env:
          # Relato con IA (narrar.py). Sin clave se usa el extracto sin IA.
          # Cualquier API compatible con OpenAI: xAI por defecto; Gemini o Groq con NARRA_API_URL.
          NARRA_API_KEY: ${{ secrets.NARRA_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          NARRA_API_URL: ${{ vars.NARRA_API_URL }}
          NARRA_MODEL: ${{ vars.NARRA_MODEL }}
          NARRA_RPM: ${{ vars.NARRA_RPM }}
          NARRA_MAX_CALLS: ${{ vars.NARRA_MAX_CALLS }}
        run: python actualizar.py

      - name: Validar noticias.json (no se publica si es inválido)
        run: |
          python - <<'PY'
          import json, actualizar
          actualizar.validate_payload(json.load(open("noticias.json", encoding="utf-8")))
          print("noticias.json válido")
          PY

      - name: Guardar noticias.json (y narraciones.json) si cambió
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Se guardan solo los archivos de datos y se reaplican sobre el main más reciente:
          # nunca se reescribe ni revierte código que haya llegado a main durante la corrida.
          OUT="$RUNNER_TEMP/salida"; mkdir -p "$OUT"
          cp noticias.json "$OUT/"
          if [ -f narraciones.json ]; then cp narraciones.json "$OUT/"; fi
          for i in 1 2 3; do
            git fetch -q origin main
            git checkout -q -f -B publicar origin/main
            cp "$OUT"/*.json .
            git add noticias.json
            if [ -f narraciones.json ]; then git add narraciones.json; fi
            if git diff --cached --quiet; then
              echo "Sin cambios."
              exit 0
            fi
            git commit -q -m "Actualizar noticias $(date -u +'%Y-%m-%d %H:%M') UTC"
            if git push origin HEAD:main; then exit 0; fi
            sleep 5
          done
          exit 1
