name: Actualizar noticias

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar-noticias
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Descargar feeds y armar consenso
        env:
          # Relato con IA (narrar.py). Sin clave se usa el extracto sin IA.
          # Cualquier API compatible con OpenAI: xAI por defecto; Gemini o Groq con NARRA_API_URL.
          NARRA_API_KEY: ${{ secrets.NARRA_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          NARRA_API_URL: ${{ vars.NARRA_API_URL }}
          NARRA_MODEL: ${{ vars.NARRA_MODEL }}
          NARRA_RPM: ${{ vars.NARRA_RPM }}
          NARRA_MAX_CALLS: ${{ vars.NARRA_MAX_CALLS }}
        run: python actualizar.py

      - name: Guardar noticias.json (y narraciones.json) si cambió
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add noticias.json
          if [ -f narraciones.json ]; then git add narraciones.json; fi
          if git diff --cached --quiet; then
            echo "Sin cambios."
            exit 0
          fi
          git commit -m "Actualizar noticias $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase origin main
          git push origin HEAD:main
