<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1c1916">
  <meta name="description" content="Briefing de consenso: solo las noticias que publican varios medios a la vez.">
  <title>Noticias · Consenso</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <p class="kicker">Briefing de consenso</p>
    <h1>Noticias</h1>
    <p class="intro">Solo aparecen las historias que publican al menos 2 medios distintos (en Buenas noticias basta 1 medio confiable).</p>
    <p class="schedule" id="schedule">Cargando la última actualización…</p>
  </header>

  <nav class="tabs" id="tabs" aria-label="Categorías"></nav>

  <div class="langs" role="group" aria-label="Idioma del texto">
    <button type="button" class="lang on" data-lang="all">Ambos</button>
    <button type="button" class="lang" data-lang="es">Español</button>
    <button type="button" class="lang" data-lang="en">English</button>
  </div>

  <main id="list" class="list"></main>
  <footer class="foot" id="foot"></footer>
  <script src="app.js"></script>
</body>
</html>
